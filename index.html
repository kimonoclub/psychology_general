<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心理学入門：講義アーカイブポータル</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        body { background-color: #f2f6f3; font-family: 'Noto Sans JP', sans-serif; }
    </style>
</head>
<body class="py-12 px-4 md:px-8">

    <header class="max-w-5xl mx-auto mb-12">
        <h1 class="text-3xl font-bold text-slate-800 mb-2">心理学入門</h1>
        <p class="text-slate-600">講義資料アーカイブポータル</p>
    </header>

    <div class="max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="portal-grid">
        <!-- JSでカードが自動生成されます -->
    </div>

    <script>
        async function buildPortal() {
            const grid = document.getElementById('portal-grid');
            
            for (let i = 1; i <= 15; i++) {
                const folder = `class_${i.toString().padStart(2, '0')}`;
                const card = document.createElement('div');
                card.className = "bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between h-48";
                
                try {
                    const response = await fetch(`${folder}/index.html`);
                    if (response.ok) {
                        const htmlText = await response.text();
                        const doc = new DOMParser().parseFromString(htmlText, 'text/html');
                        const title = doc.title
                            .replace(/心理学入門：/g, '')
                            .replace(/（ビジュアル副読本）/g, '')
                            .trim();
                        
                        // 公開済みカードの構成
                        card.classList.add('border-l-4', 'border-l-emerald-600');
                        card.innerHTML = `
                            <div>
                                <div class="flex justify-between items-start mb-2">
                                    <span class="text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-1 rounded">第${i}回</span>
                                    <span class="text-[10px] text-slate-400">公開中</span>
                                </div>
                                <h3 class="text-lg font-bold text-slate-800 leading-tight">${title}</h3>
                            </div>
                            <a href="${folder}/index.html" class="block text-center py-2 bg-slate-800 text-white rounded-lg text-sm font-bold hover:bg-slate-900 transition">
                                <i class="fa-solid fa-book-open mr-2"></i> 副読本を開く
                            </a>
                        `;
                    } else {
                        throw new Error();
                    }
                } catch (e) {
                    // 未公開カードの構成
                    card.classList.add('bg-slate-50', 'opacity-60');
                    card.innerHTML = `
                        <div class="flex flex-col h-full justify-center items-center text-slate-400">
                            <span class="text-xl font-bold mb-2">第${i}回</span>
                            <span class="text-xs">フォローアップ未申請</span>
                        </div>
                    `;
                }
                grid.appendChild(card);
            }
        }
        buildPortal();
    </script>
</body>
</html>
